<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>வேற்றுமுகம் — இந்திய செய்திகள் & ஆழமான பின்னணி</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Tamil:ital@0;1&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4f1e8;
    --ink:#191712;
    --ink-soft:#5a5548;
    --rule:#cabf9f;
    --gold:#a8720f;
    --indigo:#1f3c5c;
    --card:#fffdf6;
    --danger:#93342a;
    --wash:#eae4d2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.5;
  }
  .tamil{font-family:'Tiro Tamil','Inter',sans-serif;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  
  .ticker-bar{
    background:var(--ink); color:var(--paper); overflow:hidden;
    white-space:nowrap; font-size:12.5px; padding:6px 0;
  }
  .ticker-track{
    display:inline-block; padding-left:100%;
    animation:ticker 40s linear infinite;
  }
  @keyframes ticker{ from{transform:translateX(0);} to{transform:translateX(-100%);} }
  .ticker-track span{margin-right:36px; opacity:.9;}
  .ticker-track span b{color:var(--gold);}

  .masthead{
    max-width:1180px; margin:0 auto; padding:26px 24px 14px;
    display:flex; align-items:flex-end; justify-content:space-between;
    flex-wrap:wrap; gap:10px; border-bottom:1px solid var(--ink);
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand .mark{
    width:34px; height:34px; background:var(--ink); color:var(--paper);
    display:inline-flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:700; font-size:18px;
  }
  .brand h1{font-size:32px; font-weight:700; margin:0;}
  .brand .sub{font-size:12.5px; color:var(--ink-soft); font-family:'Tiro Tamil',serif;}
  .dateline{font-size:12.5px; color:var(--ink-soft);}

  nav.tabs{
    max-width:1180px; margin:0 auto; padding:0 24px;
    display:flex; align-items:flex-end; gap:2px; flex-wrap:wrap;
  }
  .tab-btn{
    font-size:13.5px; font-weight:600; padding:9px 15px;
    background:var(--wash); color:var(--ink-soft); border:1px solid var(--rule);
    border-bottom:none; clip-path:polygon(6% 0, 94% 0, 100% 100%, 0% 100%);
    cursor:pointer;
  }
  .tab-btn.active{
    background:var(--card); color:var(--ink); border-color:var(--ink); font-weight:700;
  }
  .state-wrap{position:relative;}
  .state-btn{
    font-size:13.5px; font-weight:600; padding:9px 15px;
    background:var(--wash); color:var(--ink-soft); border:1px solid var(--rule);
    border-bottom:none; clip-path:polygon(6% 0, 94% 0, 100% 100%, 0% 100%);
    cursor:pointer;
  }
  .state-btn.on{background:var(--indigo); color:#fff; border-color:var(--indigo);}
  .state-menu{
    display:none; position:absolute; top:100%; left:0;
    background:var(--card); border:1px solid var(--ink); width:380px;
    max-width:85vw; padding:12px; z-index:30; box-shadow:6px 6px 0 rgba(0,0,0,0.06);
  }
  .state-menu.open{display:block;}
  .state-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px; max-height:260px; overflow-y:auto;}
  .state-item{font-size:13px; padding:5px; cursor:pointer; border-bottom:1px dotted var(--rule);}
  .state-item:hover{color:var(--gold);}

  .filter-strip{
    max-width:1180px; margin:16px auto 0; padding:10px 24px;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--wash); border-top:1px solid var(--rule); border-bottom:1px solid var(--rule);
  }
  select{padding:6px 10px; border:1px solid var(--ink); background:var(--card);}
  .status-pill{font-size:11.5px; padding:3px 8px; border:1px solid var(--rule); color:var(--ink-soft);}
  .status-pill.live{border-color:var(--gold); color:var(--gold); font-weight:700;}

  #search-input{
    padding:6px 10px; border:1px solid var(--ink); background:var(--card);
    min-width:220px; font-family:'Inter',sans-serif; font-size:13px;
  }
  #search-btn{
    clip-path:none; padding:5px 10px; background:var(--indigo);
    color:#fff; border-color:var(--indigo);
  }

  main{max-width:1180px; margin:0 auto; padding:20px 24px;}
  .section-label{
    font-size:13px; color:var(--gold); font-weight:700; margin-bottom:15px;
    padding-bottom:5px; border-bottom:2px solid var(--ink); display:flex; justify-content:space-between;
  }
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:20px;}
  .card{
    background:var(--card); border:1px solid var(--rule); border-top:3px solid var(--ink);
    padding:16px; cursor:pointer; display:flex; flex-direction:column; gap:8px;
    transition:transform .15s;
  }
  .card:hover{transform:translateY(-2px); border-top-color:var(--gold);}
  .card .cat{font-size:11px; color:var(--gold); font-weight:700;}
  .card h3{font-size:16px; margin:0; line-height:1.35;}
  .card p{font-size:12.5px; color:var(--ink-soft); margin:0; flex-grow:1;}
  .card .meta{font-size:11px; color:var(--ink-soft); border-top:1px solid var(--rule); padding-top:6px; display:flex; justify-content:space-between;}

  /* ---------- Modal (4-Deep Sections) ---------- */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; padding:20px; z-index:100;}
  .overlay.open{display:flex;}
  .modal{
    background:var(--paper); max-width:760px; width:100%; max-height:90vh;
    overflow-y:auto; border:2px solid var(--ink); box-shadow:8px 8px 0 rgba(0,0,0,0.15);
  }
  .modal-head{padding:20px; border-bottom:1px solid var(--ink); position:relative;}
  .modal-head h2{font-size:22px; margin:6px 0;}
  .close-btn{position:absolute; top:16px; right:16px; background:none; border:none; font-size:24px; cursor:pointer;}
  .modal-body{padding:20px;}
  
  .deep-box{
    margin-bottom:16px; padding:14px; background:var(--card);
    border:1px solid var(--rule); border-left:4px solid var(--indigo);
  }
  .deep-box.history{border-left-color:#8e44ad;}
  .deep-box.science{border-left-color:#d35400;}
  .deep-box.future{border-left-color:#27ae60;}
  .deep-box h4{margin:0 0 6px 0; font-size:13.5px; color:var(--ink); font-weight:700;}
  .deep-box p{margin:0; font-size:13.5px; font-family:'Tiro Tamil',serif; line-height:1.7;}
  
  .loading{padding:25px; text-align:center; font-size:14px; color:var(--indigo);}
  .err-box{padding:14px; background:#fcebe6; border:1px solid var(--danger); color:var(--danger); font-size:13px;}
</style>
</head>
<body>

<div class="ticker-bar"><div class="ticker-track" id="ticker-track"></div></div>

<header class="masthead">
  <div class="brand">
    <span class="mark">வே</span>
    <div>
      <h1>வேற்றுமுகம்</h1>
      <div class="sub">செய்திகள் மட்டுமல்ல — அதன் முழு வரலாறு, அறிவியல் மற்றும் எதிர்காலம்</div>
    </div>
  </div>
  <div class="dateline" id="today-date"></div>
</header>

<nav class="tabs" id="tabs-nav">
  <div class="state-wrap">
    <button class="state-btn" id="state-btn">இந்தியா ▾</button>
    <div class="state-menu" id="state-menu">
      <div class="state-grid" id="state-grid"></div>
    </div>
  </div>
</nav>

<div class="filter-strip">
  <select id="year-select"><option value="">அனைத்து வருடம்</option></select>
  <select id="month-select"><option value="">அனைத்து மாதம்</option></select>
  <button class="tab-btn" id="reset-btn" style="clip-path:none; padding:5px 10px;">Filter Clear</button>

  <input type="text" id="search-input" placeholder="தேடு... (எ.கா: பங்குச் சந்தை)">
  <button class="tab-btn" id="search-btn">🔍 தேடு</button>

  <span class="status-pill" id="status-pill">Live Active</span>
</div>

<main>
  <div class="section-label"><span id="section-title">அண்மைச் செய்திகள்</span><span id="result-count"></span></div>
  <div class="grid" id="news-grid"></div>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <button class="close-btn" id="close-btn">&times;</button>
      <div id="modal-cat" style="font-size:12px; color:var(--gold); font-weight:bold;"></div>
      <h2 id="modal-title"></h2>
      <div id="modal-meta" style="font-size:12px; color:var(--ink-soft);"></div>
    </div>
    <div class="modal-body">
      <div id="modal-desc" style="font-size:14px; margin-bottom:16px; color:var(--ink-soft);"></div>
      <div id="analysis-container"></div>
    </div>
  </div>
</div>

<script>
// Render Backend URL
const API_BACKEND_URL = "https://news-hnn4.onrender.com";

const NAV_CATEGORIES = [
  {key:'top', label:'முகப்பு'},
  {key:'politics', label:'அரசியல்'},
  {key:'business', label:'வணிகம்'},
  {key:'sports', label:'விளையாட்டு'},
  {key:'technology', label:'தொழில்நுட்பம்'},
  {key:'environment', label:'சுற்றுச்சூழல்'},
  {key:'world', label:'உலகம்'},
  {key:'india_impact', label:'🌍 உலகம் → இந்தியா தாக்கம்'}
];

// Curated real-article search query for the India-impact tab (war/conflict/economic events + India)
const INDIA_IMPACT_QUERY = '(war OR conflict OR sanctions OR "interest rate" OR "repo rate" OR tariff OR "crude oil" OR "trade deal") AND India';

const STATES = [
  {en:'Tamil Nadu', ta:'தமிழ்நாடு'},
  {en:'Kerala', ta:'கேரளா'},
  {en:'Karnataka', ta:'கர்நாடகா'},
  {en:'Andhra Pradesh', ta:'ஆந்திரா'},
  {en:'Delhi', ta:'டெல்லி'},
  {en:'Maharashtra', ta:'மகாராஷ்டிரா'},
  {en:'Gujarat', ta:'குஜராத்'},
  {en:'West Bengal', ta:'மேற்கு வங்காளம்'}
];

let currentNews = [];
let currentCategory = 'top';
let currentStateFilter = null;
let currentSearchQuery = '';

const tabsNav = document.getElementById('tabs-nav');
const grid = document.getElementById('news-grid');
const yearSelect = document.getElementById('year-select');
const monthSelect = document.getElementById('month-select');
const searchInput = document.getElementById('search-input');
const searchBtn = document.getElementById('search-btn');

// Build Nav Tabs
NAV_CATEGORIES.forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (cat.key === currentCategory ? ' active' : '');
  btn.textContent = cat.label;
  btn.onclick = () => {
    currentCategory = cat.key;
    currentSearchQuery = '';
    searchInput.value = '';
    yearSelect.value = '';
    monthSelect.value = '';
    document.getElementById('section-title').textContent = cat.key === 'india_impact'
      ? 'உலக நிகழ்வுகள் — இந்தியாவுக்கான தாக்கம்'
      : 'அண்மைச் செய்திகள்';
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
    fetchNews();
  };
  tabsNav.insertBefore(btn, tabsNav.lastElementChild);
});

// State Menu
const stateBtn = document.getElementById('state-btn');
const stateMenu = document.getElementById('state-menu');
const stateGrid = document.getElementById('state-grid');

STATES.forEach(st => {
  const item = document.createElement('div');
  item.className = 'state-item';
  item.textContent = st.ta;
  item.onclick = () => {
    currentStateFilter = st;
    currentCategory = 'top';
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    stateBtn.textContent = st.ta;
    stateBtn.classList.add('on');
    stateMenu.classList.remove('open');
    document.getElementById('section-title').textContent = currentSearchQuery
      ? `"${currentSearchQuery}" + ${st.ta} — தேடல் முடிவுகள்`
      : 'அண்மைச் செய்திகள்';
    fetchNews();
  };
  stateGrid.appendChild(item);
});

stateBtn.onclick = (e) => { e.stopPropagation(); stateMenu.classList.toggle('open'); };
document.onclick = () => stateMenu.classList.remove('open');

// Search
function doSearch(){
  currentSearchQuery = searchInput.value.trim();
  currentCategory = 'top';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  // NOTE: currentStateFilter is intentionally NOT cleared here, so
  // "state + search" (e.g. Tamil Nadu + "tirupur") combine together.

  document.getElementById('section-title').textContent = currentSearchQuery
    ? (currentStateFilter ? `"${currentSearchQuery}" + ${currentStateFilter.ta} — தேடல் முடிவுகள்` : `"${currentSearchQuery}" — தேடல் முடிவுகள்`)
    : 'அண்மைச் செய்திகள்';

  fetchNews();
}
searchBtn.onclick = doSearch;
searchInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') doSearch(); });

// ---------- Year / Month setup (static list, NOT derived from fetched news) ----------
function populateYearMonth(){
  const currentYear = new Date().getFullYear();
  let yearsHtml = '<option value="">அனைத்து வருடம்</option>';
  for(let y = currentYear; y >= currentYear - 49; y--){
    yearsHtml += `<option value="${y}">${y}</option>`;
  }
  yearSelect.innerHTML = yearsHtml;

  const months = ["01","02","03","04","05","06","07","08","09","10","11","12"];
  const mNames = ["ஜனவரி","பிப்ரவரி","மார்ச்","ஏப்ரல்","மே","ஜூன்","ஜூலை","ஆகஸ்ட்","செப்டம்பர்","அக்டோபர்","நவம்பர்","டிசம்பர்"];
  monthSelect.innerHTML = '<option value="">அனைத்து மாதம்</option>' + months.map((m, i) => `<option value="${m}">${mNames[i]}</option>`).join('');
}

function buildDateRange(){
  const y = yearSelect.value;
  const m = monthSelect.value;
  if(!y && !m) return {};

  const year = y || String(new Date().getFullYear());
  if(m){
    const lastDay = new Date(parseInt(year), parseInt(m), 0).getDate();
    return {
      from_date: `${year}-${m}-01`,
      to_date: `${year}-${m}-${String(lastDay).padStart(2,'0')}`
    };
  }
  return { from_date: `${year}-01-01`, to_date: `${year}-12-31` };
}

// Year/Month change → fresh SERVER-SIDE fetch for that date range (not client filter)
yearSelect.onchange = fetchNews;
monthSelect.onchange = fetchNews;

document.getElementById('reset-btn').onclick = () => {
  yearSelect.value = '';
  monthSelect.value = '';
  fetchNews();
};

async function fetchNews(){
  const lang = (currentStateFilter && currentStateFilter.en === 'Tamil Nadu') ? 'ta' : 'en';
  const params = new URLSearchParams({ language: lang });

  if(currentSearchQuery){
    // search box text combines with state filter if one is selected
    params.set('query', currentSearchQuery);
    if(currentStateFilter) params.set('state', currentStateFilter.en);
  } else if(currentCategory === 'india_impact'){
    params.set('query', INDIA_IMPACT_QUERY);
  } else {
    if(currentCategory !== 'top') params.set('category', currentCategory);
    if(currentStateFilter) params.set('state', currentStateFilter.en);
  }

  const range = buildDateRange();
  if(range.from_date) params.set('from_date', range.from_date);
  if(range.to_date) params.set('to_date', range.to_date);

  grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:30px;">ஏற்றுகிறது...</div>';
  document.getElementById('result-count').textContent = '';

  try {
    const res = await fetch(`${API_BACKEND_URL}/api/news?${params.toString()}`);
    const data = await res.json();
    if(!res.ok) throw new Error((data && data.error) || 'Server error');

    currentNews = (Array.isArray(data) ? data : (data.results || [])).map(a => ({
      title: a.title || 'தலைப்பு இல்லை',
      desc: a.description || '',
      date: (a.pubDate || '').slice(0, 10) || new Date().toISOString().slice(0, 10),
      source: a.source_id || 'News',
      category: currentCategory === 'india_impact' ? 'இந்தியா தாக்கம்' : currentCategory
    }));
    const notice = (!Array.isArray(data) && data.notice) ? data.notice : null;
    renderList(currentNews, notice);
  } catch (err) {
    grid.innerHTML = `<div style="grid-column:1/-1; padding:20px;" class="err-box">செய்திகளைப் பெறுவதில் பிழை: ${err.message}<br><span style="font-size:11px;">(API plan-ல் date-range archive இல்லனா இந்த error வரலாம்)</span></div>`;
  }
}

function renderList(list, notice){
  document.getElementById('result-count').textContent = `${list.length} செய்திகள்`;
  grid.innerHTML = '';

  if(notice){
    const noticeEl = document.createElement('div');
    noticeEl.style.cssText = 'grid-column:1/-1; background:#fff7e0; border:1px solid #d4a017; color:#7a5b00; padding:10px 14px; font-size:12.5px;';
    noticeEl.textContent = notice;
    grid.appendChild(noticeEl);
  }

  if(!list.length){
    grid.innerHTML += '<div style="grid-column:1/-1; text-align:center; padding:30px;">செய்திகள் இல்லை.</div>';
    return;
  }

  list.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="cat">${item.category.toUpperCase()}</div>
      <h3>${item.title}</h3>
      <p>${item.desc.slice(0, 110)}...</p>
      <div class="meta"><span>${item.date}</span><span>${item.source}</span></div>
    `;
    card.onclick = () => openAnalysis(item);
    grid.appendChild(card);
  });
}

// 4-Deep Analysis Trigger
async function openAnalysis(item){
  const overlay = document.getElementById('overlay');
  const container = document.getElementById('analysis-container');
  
  document.getElementById('modal-cat').textContent = item.category;
  document.getElementById('modal-title').textContent = item.title;
  document.getElementById('modal-meta').textContent = `${item.date} · ${item.source}`;
  document.getElementById('modal-desc').textContent = item.desc;
  
  overlay.classList.add('open');
  container.innerHTML = '<div class="loading">🔍 Gemini Pro முழுப் பின்னணி, வரலாறு, அறிவியல் காரணங்களை ஆராய்கிறது...</div>';

  try {
    const res = await fetch(`${API_BACKEND_URL}/api/analyze`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        title: item.title,
        desc: item.desc,
        date: item.date,
        focus: currentCategory === 'india_impact' ? 'india_economic_impact' : null
      })
    });

    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Server error');

    // Parse Response
    const cleaned = data.analysis.replace(/```json|```/g, '').trim();
    const p = JSON.parse(cleaned);

    container.innerHTML = `
      <div class="deep-box">
        <h4>📌 1. என்ன நடந்தது? (விரிவான தகவல்)</h4>
        <p>${p.what_happened}</p>
      </div>
      <div class="deep-box history">
        <h4>📜 2. வரலாற்று பின்னணி (இதற்கு முன் எங்கு நடந்தது?)</h4>
        <p>${p.past_history}</p>
      </div>
      <div class="deep-box science">
        <h4>🔬 3. அறிவியல் காரணங்கள் & விஞ்ஞானிகள் கருத்து</h4>
        <p>${p.scientific_reasons}</p>
      </div>
      <div class="deep-box future">
        <h4>🔮 4. எதிர்கால தாக்கம் & முன்னெச்சரிக்கை</h4>
        <p>${p.future_outlook}</p>
      </div>
      ${p.india_effect ? `
      <div class="deep-box" style="border-left-color:#c0392b;">
        <h4>💰 5. இந்தியாவுக்கான தாக்கம் (செலவு / பொருளாதாரம்)</h4>
        <p>${p.india_effect}</p>
      </div>` : ''}
    `;
  } catch (err) {
    container.innerHTML = `<div class="err-box">பகுப்பாய்வு பிழை: ${err.message}</div>`;
  }
}

document.getElementById('close-btn').onclick = () => document.getElementById('overlay').classList.remove('open');

// 10 நிமிடங்களுக்கு ஒருமுறை Auto-refresh
setInterval(() => {
  if(!document.getElementById('overlay').classList.contains('open')){
